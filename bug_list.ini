
[Rainmeter]
Update=60000
DynamicWindowSize=1
AccurateText=1
OnUpdateAction=[!CommandMeasure MeasurePython "Run"]


[Variables]
MaxBug=8
FontSize=12
FontColor=0,102,255
HoverColor=255,80,80
NormalColor=0,102,255
ColorAssign=255,180,0      # Open → 橙色
ColorNeed=255,80,80      # NeedInfo → 红色
ColorRoot=0,200,0        # RootCaused → 绿色
ColorNew=255,0,0
ColorDefault=200,200,200 # 其他状态 → 灰色

[Background]
Meter=Shape
Shape=Rectangle 0,0,400,160,8 | Fill Color 20,20,20,180 | StrokeWidth 0
DynamicVariables=1

# -------------------------------
# Python 输出 → MeasureBugList
# -------------------------------


[MeasurePython]
Measure=Plugin
Plugin=RunCommand
Program="C:\Users\xjx\AppData\Local\Programs\Python\Python38\python.exe"
Parameter="C:\Users\xjx\Documents\Rainmeter\Skins\buglist\bugzilla_rainmeter.py"
OutputType=UTF8




[MeasureBugList]
Measure=String
String=[MeasurePython]
DynamicVariables=1

[MeasureLua]
Measure=Script
ScriptFile=bug_list.lua

#===========================================================
# 预定义 5 个 meter（Lua 中会动态填 Text）
#===========================================================

[MeterBug1]
Meter=String
X=10
Y=0
FontFace=Microsoft YaHei
FontSize=12
W=400          # 或你的背景宽度 - padding
ClipString=1   # 必须开启，超长自动省略号
DynamicVariables=1

