
[Rainmeter]
; 皮肤每 0.5 秒更新一次用于闪烁动画；Python 仍由下面的 MeasureRefreshTick 每 60 秒触发一次
Update=500
DynamicWindowSize=1
AccurateText=1
OnRefreshAction=[!CommandMeasure MeasurePython "Run"]

[Variables]
; 最多显示几行 bug（需与下面 MeterBug 的数量匹配）
MaxBug=8

; 本机 Python 解释器路径，换机器时只需要改这一行
PythonPath=C:\Users\xjx\AppData\Local\Programs\Python\Python38\python.exe

; Python 成功查询后写下的缓存，刷新/启动时先显示它
CacheFile=#CURRENTPATH#cache.txt

; 用户点击后写入的确认文件，Python 读取后不再标记该 bug
AckFile=#CURRENTPATH#ack.txt

FontSize=12
FontFace=Microsoft YaHei

; 状态颜色
ColorAssign=255,180,0
ColorNeed=255,80,80
ColorRoot=0,200,0
ColorNew=255,0,0
ColorDefault=200,200,200
; 有更新的行闪烁时，字体在原状态色与这个灰色之间切换
ColorFlash=150,150,150

[Background]
Meter=Shape
Shape=Rectangle 0,0,400,160,8 | Fill Color 20,20,20,180 | StrokeWidth 0
DynamicVariables=1

; -------------------------------
; Python 输出 -> MeasureBugList
; -------------------------------

[MeasurePython]
Measure=Plugin
Plugin=RunCommand
Program="#PythonPath#"
Parameter="#CURRENTPATH#bugzilla_rainmeter.py"
OutputType=UTF8

; 每 120 次皮肤更新（Update=500，即每 60 秒）跑一次 Python
[MeasureRefreshTick]
Measure=Calc
Formula=MeasureRefreshTick + 1
UpdateDivider=120
OnUpdateAction=[!CommandMeasure MeasurePython "Run"]

[MeasureBugList]
Measure=String
String=[MeasurePython]
DynamicVariables=1

[MeasureLua]
Measure=Script
ScriptFile=bug_list.lua

;===========================================================
; 预定义 8 个 bug 行 + 1 个状态行，Lua 会动态填 Text
;===========================================================

[MeterStatus]
Meter=String
Hidden=1
X=10
Y=0
W=380
FontFace=#FontFace#
FontSize=9
FontColor=150,150,150
ClipString=1
DynamicVariables=1

